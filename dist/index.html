function viewHtml(){switch(state.view){case'overview':return state.role==='Customer'?customerHome():state.role==='Producer'?producerHome():state.role==='Claims Adjuster'?claimsAdjusterPage():state.role==='Product Admin'?productAdminHome():underwriterHome();case'quote':return quotePage();case'policies':return policyPage();case'billing':return billingPage();case'claims':return claimsPage();case'support':return supportPage();case'submissions':return state.role==='Producer'?producerPage()+producerAdvancedSections():producerPage();case'underwriting':return underwritingPage();case'claim-workspace':return state.role==='Claims Adjuster'?claimsAdjusterPage():claimsPage();case'configuration':return configPage();case'qa':return qaPage();default:return customerHome()}}
function render(){state.vehicleSigned=localStorage.getItem('cedarVehicleSigned')==='yes';roleUi();side();$('#content').innerHTML=viewHtml();if(state.role==='Producer'&&state.view==='submissions')$$('[data-action="producer-filter"]').forEach(b=>b.classList.toggle('active',b.dataset.value===state.producerFilter))}

function calculate(){const name=$('#qName')?.value.trim(),zip=$('#qZip')?.value.trim(),email=$('#qEmail')?.value.trim();if(!name||!/^[0-9]{5}$/.test(zip)||!email){toast('Complete the applicant name, valid 5-digit ZIP, and email first.');return}const p=state.quoteProduct,drivers=Number($('#qDrivers')?.value||1),miles=Number($('#qMiles')?.value||9000),years=Number($('#qYears')?.value||8),incidents=Number($('#qRecord')?.value||0),physical=$('#qPhysical')?.value==='yes';let auto=p==='Home'?0:Number(state.settings.autoBase)*(drivers>1?1+(drivers-1)*.18:1)*(miles>12000?1.22:miles>9000?1.1:miles<=6000?.91:1)*(years<3?1.35:years>=10?.93:1)*(incidents?1+incidents*.28:1)*(physical?1:.62)*Number(state.settings.territoryFactor);let home=p==='Auto'?0:Number(state.settings.homeBase)*Number(state.settings.territoryFactor)*(Number($('#qYear')?.value||1998)<1980?1.25:1)*(Number($('#qDwelling')?.value||540000)/540000);let discount=auto*(Math.min(Number(state.settings.goodDriverDiscount),20)/100);if(incidents>0)discount=0;const bundle=p==='Home + Auto'?((auto+home)*(Number(state.settings.bundleDiscount)/100)):0;let annual=Math.round(auto+home-discount-bundle);let referral=Number($('#qYear')?.value||1998)<1970||Number(state.settings.territoryFactor)>1.35;state.quote={id:'CL-QT-'+Math.floor(10000+Math.random()*89999),name,zip,email,date:$('#qDate')?.value,annual,monthly:Math.ceil(annual/12),discount:Math.round(discount+bundle),referral,status:referral?'Quote · referral required':'Preliminary quote',note:referral?'A sample rule triggered a manual review. An underwriter must review before bind.':'Illustrative factors were applied; confirm final application details and filed carrier rules.',bound:false};state.quoteStep=2;render();toast('Illustrative quote calculated. Review coverage and referral status.')}

function bind(){if(!state.quote){toast('Calculate a quote first.');return}if(state.quote.referral){toast('Referral is required before bind. Route this quote to underwriting.');return}modal('Review and bind request',`<p>Confirm the simulated application for <b>${state.quote.name}</b>. You will review a sample e-sign disclosure and request policy issuance.</p><div class="notice blue">No real signature, premium collection, policy issuance, or insurer notification will occur. In production, confirm quote version, effective date, required forms, signature, first payment, and binding authority.</div><div class="settingrow"><div><div class="settingname">Electronic delivery</div><div class="settingmeta">Declarations, forms, and billing notices</div></div><span class="badge green">Selected</span></div><div class="settingrow"><div><div class="settingname">Sample annual premium</div></div><b>${money(state.quote.annual)}</b></div>`,'Review & e-sign','confirm-bind')}

edarClaimStage',state.claimStage);render();toast('Claim milestone advanced in the sample workflow.');break;case'save-settings':$$('[data-setting]').forEach(i=>state.settings[i.dataset.setting]=Number(i.value));localStorage.setItem('cedarSettings',JSON.stringify(state.settings));render();toast('Draft settings saved in this browser.');break;case'reset-settings':localStorage.removeItem('cedarSettings');location.reload();break;case'uw-approve':modal('Clear referral',`<p>Record a decision note and clear the referral for the next workflow step.</p><div class="notice green">Selected case: CL-QU-240${19-state.selectedSubmission} · ${['Jordan Miller','Priya Shah','Marcus Lee','Elena Ruiz'][state.selectedSubmission]}</div><p><b>Decision note:</b> ${$('#uwNote')?.value||'No rationale entered.'}</p><p>Decision, authority, evidence, and user identity should be captured in an immutable audit event in a production system.</p>`,'Confirm clear','decision-confirm');break;case'uw-adjust':modal('Adjust sample quote',`<p>Make an effective-dated adjustment with a recorded reason. Values remain in this browser.</p><div class="fieldgrid"><div class="field"><label>Coverage / deductible change</label><select><option>Raise liability limits</option><option>Change collision deductible</option><option>Update property deductible</option><option>Add approved mitigation credit</option></select></div><div class="field"><label>Premium adjustment</label><select><option value="0">No premium change</option><option value="-5">−5% · documented credit</option><option value="5">+5% · documented surcharge</option></select></div><div class="field"><label>Effective date</label><input type="date" value="2026-12-01"></div><div class="field"><label>Authority</label><select><option>Level 1 · within filed rules</option><option>Level 2 · delegated exception</option><option>Escalate to manager</option></select></div></div><div class="field" style="margin-top:10px"><label>Decision rationale</label><input value="Documented review of submitted risk information and applicable rule"></div><div class="notice blue" style="margin-top:12px">Production changes require filed-rule validation, premium recalculation, customer notice, and an auditable approval event.</div>`,'Save sample adjustment','uw-adjust-confirm');break;case'uw-adjust-confirm':$('#overlay').innerHTML='';toast('Sample adjustment saved to the underwriting activity trail.');break;case'uw-info':toast('Information request queued for producer follow-up.');break;case'uw-decline':modal('Refer for additional review',`<p>Record the applicable rule and evidence before an adverse underwriting decision.</p><div class="notice red">Do not use a demo score by itself as the reason to decline. Check current law, notices, filed guidelines, and assigned authority.</div><div class="field"><label>Reason / applicable rule</label><input value="Additional documentation required under filed guideline"></div>`,'Record referral','decision-confirm');break;case'decision-confirm':$('#overlay').innerHTML='';toast('Decision recorded in the sample activity log.');break;case'select-submission':state.selectedSubmission=Number(t.dataset.index);if(state.role==='Producer')state.producerTechnical=true;render();break;case'producer-tech-toggle':state.producerTechnical=!state.producerTechnical;render();break;case'download-commission':downloadCommissionStatement();break;case'log-communication':modal('Log client contact','<p>Record a producer follow-up against a sample submission.</p><div class="field"><label>Client and submission</label><select id="commClient"><option value="Jordan Miller|CL-QU-24019">Jordan Miller · CL-QU-24019</option><option value="Priya Shah|CL-QU-24018">Priya Shah · CL-QU-24018</option><option value="Marcus Lee|CL-QU-24016">Marcus Lee · CL-QU-24016</option><option value="Elena Ruiz|CL-QU-24011">Elena Ruiz · CL-QU-24011</option></select></div><div class="fieldgrid" style="margin-top:10px"><div class="field"><label>Channel</label><select id="commChannel"><option>Phone</option><option>Email</option><option>Secure portal</option><option>In person</option></select></div><div class="field"><label>Outcome</label><select id="commOutcome"><option>Reached client</option><option>Left message</option><option>Documents requested</option><option>Quote reviewed</option></select></div></div><div class="field" style="margin-top:10px"><label>Contact note</label><textarea id="commNote" rows="3" placeholder="Brief, factual follow-up note"></textarea></div>','Save sample contact','save-communication');break;case'save-communication':{const parts=($('#commClient')?.value||'Jordan Miller|CL-QU-24019').split('|'),note=($('#commNote')?.value||'').trim();if(!note){toast('Add a short contact note first.');break}state.clientComms.unshift({client:parts[0],submission:parts[1],channel:$('#commChannel')?.value||'Phone',date:new Date().toLocaleString(),outcome:($('#commOutcome')?.value||'Contact logged')+' · '+note});persist('cedarProducerComms',state.clientComms);$('#overlay').innerHTML='';render();toast('Sample client contact logged locally.');break}case'producer-filter':state.producerFilter=t.dataset.value||'All';render();break;case'producer-compare':state.producerCompare=!state.producerCompare;render();break;case'appetite-select':state.appetiteLine=t.dataset.value||'Auto';render();break;case'qa-run':runQaSuite(tests,'All tests');break;case'qa-run-selected':runQaSuite(tests.filter(x=>state.qaGroup==='All tests'||x[3]===state.qaGroup),state.qaGroup);break;case'qa-export':exportQaReport();break;case'qa-add-defect':modal('Log sample defect','<p>Use synthetic details only. Defects are saved in this browser.</p><div class="fieldgrid"><div class="field"><label>Title</label><input id="qaDefectTitle" placeholder="Short, reproducible summary"></div><div class="field"><label>Severity</label><select id="qaDefectSeverity"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="field"><label>Test case</label><input id="qaDefectCase" placeholder="For example, E2E-004"></div><div class="field"><label>Area / environment</label><input id="qaDefectArea" placeholder="Policy · SIT"></div></div><div class="fieldgrid" style="margin-top:10px"><div class="field"><label>Expected</label><textarea id="qaDefectExpected" rows="3"></textarea></div><div class="field"><label>Actual</label><textarea id="qaDefectActual" rows="3"></textarea></div></div>','Save sample defect','qa-save-defect');break;case'qa-save-defect':{const title=($('#qaDefectTitle')?.value||'').trim();if(!title){toast('Enter a defect summary first.');break}const n=(state.qaDefects||[]).length+1;state.qaDefects.unshift({id:'DEF-DEMO-'+String(Date.now()).slice(-5),caseId:($('#qaDefectCase')?.value||'Unlinked').trim(),severity:$('#qaDefectSeverity')?.value||'Medium',title,area:($('#qaDefectArea')?.value||'Unassigned').trim(),environment:'Illustrative · browser-local',expected:($('#qaDefectExpected')?.value||'Not provided').trim(),actual:($('#qaDefectActual')?.value||'Not provided').trim(),status:'Open'});persist('cedarQaDefects',state.qaDefects);$('#overlay').innerHTML='';render();toast('Sample defect saved locally.');break}case'qa-defect-status':{const d=(state.qaDefects||[]).find(x=>x.id===t.dataset.id);if(d){const cycle=['Open','In progress','Ready for retest','Closed'];d.status=cycle[(cycle.indexOf(d.status)+1)%cycle.length];persist('cedarQaDefects',state.qaDefects);render();toast('Defect status updated in this browser.')}break}case'qa-reset':state.qaRun=false;state.qaResults=[];state.qaRunRecord=null;localStorage.removeItem('cedarQaResults');localStorage.removeItem('cedarQaRunRecord');state.qaGroup='All tests';render();toast('Sample run results reset; illustrative defect records remain.');break;case'qa-group':state.qaGroup=t.dataset.value;render();break;case'menu':$('.sidebar').classList.toggle('mobile-open');break;case'support-request':modal('Secure service request',`<p>Select a topic and add a concise description. This sample request stays in this browser.</p><div class="field"><label>Topic</label><select><option>Policy question</option><option>Address change</option><option>Billing question</option><option>Claim status</option></select></div><div class="field" style="margin-top:10px"><label>Message</label><input placeholder="How can we help?"></div>`,'Submit sample request','support-confirm');break;case'support-confirm':$('#overlay').innerHTML='';toast('Sample service request created.');break;}}
);
document.addEventListener('change',e=>{if(e.target?.id==='customerDocUpload'){const files=Array.from(e.target.files||[]).map(f=>({name:f.name,date:new Date().toLocaleDateString()}));if(files.length){state.customerDocs=(state.customerDocs||[]).concat(files);persist('cedarCustomerDocs',state.customerDocs);render();toast(files.length+' document name(s) added locally. Files were not uploaded.')}}});
const savedBill=JSON.parse(localStorage.getItem('cedarBilling')||'null');if(savedBill)state.billing=savedBill;const savedSettings=JSON.parse(localStorage.getItem('cedarSettings')||'null');if(savedSettings)state.settings={...state.settings,...savedSettings};render();
})();
