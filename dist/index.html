function calculate(){const name=$('#qName')?.value.trim(),zip=$('#qZip')?.value.trim(),email=$('#qEmail')?.value.trim();if(!name||!/^[0-9]{5}$/.test(zip)||!email){toast('Complete the applicant name, valid 5-digit ZIP, and email first.');return}const p=state.quoteProduct,drivers=Number($('#qDrivers')?.value||1),miles=Number($('#qMiles')?.value||9000),years=Number($('#qYears')?.value||8),incidents=Number($('#qRecord')?.value||0),physical=$('#qPhysical')?.value==='yes';let auto=p==='Home'?0:Number(state.settings.autoBase)*(drivers>1?1+(drivers-1)*.18:1)*(miles>12000?1.22:miles>9000?1.1:miles<=6000?.91:1)*(years<3?1.35:years>=10?.93:1)*(incidents?1+incidents*.28:1)*(physical?1:.62)*Number(state.settings.territoryFactor);let home=p==='Auto'?0:Number(state.settings.homeBase)*Number(state.settings.territoryFactor)*(Number($('#qYear')?.value||1998)<1980?1.25:1)*(Number($('#qDwelling')?.value||540000)/540000);let discount=auto*(Math.min(Number(state.settings.goodDriverDiscount),20)/100);if(incidents>0)discount=0;const bundle=p==='Home + Auto'?((auto+home)*(Number(state.settings.bundleDiscount)/100)):0;let annual=Math.round(auto+home-discount-bundle);let referral=Number($('#qYear')?.value||1998)<1970||Number(state.settings.territoryFactor)>1.35;state.quote={id:'CL-QT-'+Math.floor(10000+Math.random()*89999),name,zip,email,date:$('#qDate')?.value,annual,monthly:Math.ceil(annual/12),discount:Math.round(discount+bundle),referral,status:referral?'Quote · referral required':'Preliminary quote',note:referral?'A sample rule triggered a manual review. An underwriter must review before bind.':'Illustrative factors were applied; confirm final application details and filed carrier rules.',bound:false};state.quoteStep=2;render();toast('Illustrative quote calculated. Review coverage and referral status.')}

function bind(){if(!state.quote){toast('Calculate a quote first.');return}if(state.quote.referral){toast('Referral is required before bind. Route this quote to underwriting.');return}modal('Review and bind request',`<p>Confirm the simulated application for <b>${state.quote.name}</b>. You will review a sample e-sign disclosure and request policy issuance.</p><div class="notice blue">No real signature, premium collection, policy issuance, or insurer notification will occur. In production, confirm quote version, effective date, required forms, signature, first payment, and binding authority.</div><div class="settingrow"><div><div class="settingname">Electronic delivery</div><div class="settingmeta">Declarations, forms, and billing notices</div></div><span class="badge green">Selected</span></div><div class="settingrow"><div><div class="settingname">Sample annual premium</div></div><b>${money(state.quote.annual)}</b></div>`,'Review & e-sign','confirm-bind')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-action],[data-view]');if(!t)return;if(t.dataset.view){let v=t.dataset.view;if(v==='submissions'&&state.role==='Customer')v='overview';if(v==='underwriting'&&state.role!=='Underwriter')return setView('overview');if(v==='configuration'&&state.role!=='Underwriter')return setView('overview');setView(v);return}const a=t.dataset.action;switch(a){case'download-eoi':downloadEoi();break;
case'add-vehicle':modal('Add a vehicle','<p>Use fictional vehicle details. Verification results are simulated.</p><div class="fieldgrid"><div class="field"><label>VIN (17 characters)</label><input id="vehVin" maxlength="17" placeholder="1HGBH41JXMN109186"></div><div class="field"><label>Model year</label><input id="vehYear" type="number" value="2023"></div><div class="field"><label>Make</label><input id="vehMake" placeholder="Toyota"></div><div class="field"><label>Model</label><input id="vehModel" placeholder="Camry"></div><div class="field" style="grid-column:1/-1"><label>Garaging address</label><input id="vehAddress" value="1234 Cedar Grove Lane, Woodland Hills, CA 91364"></div></div><div class="notice blue">California demo: credit data is not requested for personal auto rating. VIN, address, and driver-history status are simulated only.</div>','Verify & add vehicle','save-vehicle');break;
case'save-vehicle':{const vin=($('#vehVin')?.value||'').trim().toUpperCase(),year=Number($('#vehYear')?.value||2023),make=($('#vehMake')?.value||'').trim(),model=($('#vehModel')?.value||'').trim(),address=($('#vehAddress')?.value||'').trim();if(vin.length!==17||!make||!model||!address){toast('Enter a 17-character VIN, make, model, and garaging address.');break}const id='veh-'+Date.now();state.vehicles.push({id,vin,year,make,model,address,primary:false});state.vehicleSignature='VE-'+Math.floor(100000+Math.random()*899999);state.vehicleSigned=false;localStorage.setItem('cedarVehicleSigned','no');state.vehicleCheckMessage='VIN verification: Success · Garaging address: Verified · Driver history: Sample check complete · Credit: Not requested for California rating';persist('cedarVehicles',state.vehicles);localStorage.setItem('cedarVehicleSignature',state.vehicleSignature);localStorage.setItem('cedarVehicleCheckMessage',state.vehicleCheckMessage);$('#overlay').innerHTML='';render();toast('Vehicle added. VIN and address checks succeeded in this simulation; endorsement is ready for e-signature.');break}
case'remove-vehicle':state.vehicles=state.vehicles.filter(v=>v.id!==t.dataset.id||v.primary);persist('cedarVehicles',state.vehicles);render();toast('Additional vehicle removed from this sample view.');break;
case'sign-vehicle':state.vehicleSigned=true;localStorage.setItem('cedarVehicleSigned','yes');$('#overlay').innerHTML='';render();toast('Sample endorsement e-signature recorded. No policy transaction was sent.');break;
case'add-property':modal('Add home or renters coverage','<p>Request a sample quote for a home or renters policy.</p><div class="field"><label>Coverage type</label><select id="propertyType"><option>Homeowners</option><option>Renters</option></select></div><div class="field" style="margin-top:10px"><label>Insured property address</label><input id="propertyAddress" placeholder="Street, city, CA ZIP"></div><div class="field" style="margin-top:10px"><label>Requested effective date</label><input id="propertyDate" type="date" value="2026-12-01"></div><div class="notice blue">This creates a local quote request only. Eligibility and premium require a filed product and underwriting review.</div>','Request sample quote','save-property');break;
case'save-property':{const type=$('#propertyType')?.value||'Renters',address=($('#propertyAddress')?.value||'').trim(),date=$('#propertyDate')?.value||'2026-12-01';if(!address){toast('Enter the property address first.');break}const item={id:'PR-'+Math.floor(100000+Math.random()*899999),type,address,date:new Date().toLocaleDateString()};state.propertyRequests.unshift(item);persist('cedarPropertyRequests',state.propertyRequests);$('#overlay').innerHTML='';render();toast(type+' sample quote request created for review.');break}
case'change-address':modal('Request an address change','<p>Submit the new mailing or garaging address for endorsement review.</p><div class="field"><label>New street address</label><input id="newAddress" placeholder="Street address"></div><div class="fieldgrid" style="margin-top:10px"><div class="field"><label>City</label><input id="newCity" placeholder="City"></div><div class="field"><label>State</label><input id="newState" value="CA" maxlength="2"></div><div class="field"><label>ZIP code</label><input id="newZip" inputmode="numeric" maxlength="5" placeholder="91364"></div></div><div class="notice blue">Address changes can affect policy eligibility, territory, notices, and premium. This request will be queued locally for endorsement review.</div>','Send to endorsement','save-address');break;
case'save-address':{const street=($('#newAddress')?.value||'').trim(),city=($('#newCity')?.value||'').trim(),st=($('#newState')?.value||'CA').trim().toUpperCase(),zip=($('#newZip')?.value||'').trim();if(!street||!city||!/^[0-9]{5}$/.test(zip)){toast('Enter street, city, and a valid 5-digit ZIP.');break}state.endorsements.unshift({title:'Address change request',detail:street+', '+city+', '+st+' '+zip,date:new Date().toLocaleDateString()});persist('cedarEndorsements',state.endorsements);$('#overlay').innerHTML='';render();toast('Address change sent to the sample endorsement queue.');break}
case'add-payment':modal('Add a payment method','<p>Enter fictional sample values only. Full account numbers are not stored.</p><div class="field"><label>Payment type</label><select id="pmType"><option>Credit card</option><option>Debit card</option><option>Bank account</option></select></div><div class="field" style="margin-top:10px"><label>Account holder</label><input id="pmName" value="Jordan Morgan"></div><div class="field" style="margin-top:10px"><label>Demo last four digits</label><input id="pmLast4" inputmode="numeric" maxlength="4" placeholder="1234"></div><div class="field" style="margin-top:10px"><label>Expiration (card only)</label><input id="pmExpiry" placeholder="MM/YY"></div>','Save sample method','save-payment');break;
case'save-payment':{const type=$('#pmType')?.value||'Credit card',name=($('#pmName')?.value||'Jordan Morgan').trim(),last4=($('#pmLast4')?.value||'').trim();if(!/^[0-9]{4}$/.test(last4)){toast('Enter four fictional digits for the sample method.');break}const p={id:'pm-'+Date.now(),type,brand:type==='Bank account'?'Sample bank':type==='Debit card'?'Debit card':'Credit card',name,last4,expiry:type==='Bank account'?'Sample account':($('#pmExpiry')?.value||'Sample token')};state.paymentMethods.push(p);state.activePayment=p.id;persist('cedarPaymentMethods',state.paymentMethods);localStorage.setItem('cedarActivePayment',p.id);$('#overlay').innerHTML='';render();toast('Sample payment method saved. Full credentials were not retained.');break}
case'select-payment':state.activePayment=t.value||t.querySelector('input')?.value||'';localStorage.setItem('cedarActivePayment',state.activePayment);render();toast('Default payment method updated locally.');break;
case'claim-update':{const explanation=($('#existingClaimExplanation')?.value||'').trim(),files=Array.from($('#existingClaimFiles')?.files||[]).map(f=>f.name);if(!explanation&&!files.length){toast('Add an explanation or choose photos/videos first.');break}state.customerClaims.unshift({id:'CL-260184 update',type:'Existing auto claim',explanation:explanation||'Media attachments added',files});persist('cedarCustomerClaims',state.customerClaims);render();toast('Claim update and attachment names added locally.');break}
case'new-claim':modal('Report a sample claim','<p>Share what happened and attach photos or videos to the first notice.</p><div class="fieldgrid"><div class="field"><label>Policy</label><select id="newClaimPolicy"><option>Auto · PA-CA-209538</option><option>Home · HO-CA-108421</option></select></div><div class="field"><label>Loss type</label><select id="newClaimType"><option>Collision</option><option>Property damage</option><option>Theft</option><option>Weather / fire</option></select></div><div class="field"><label>Date of loss</label><input id="newClaimDate" type="date" value="2026-11-13"></div><div class="field"><label>Injuries reported?</label><select id="newClaimInjuries"><option>No</option><option>Yes</option><option>Unknown</option></select></div></div><div class="field" style="margin-top:10px"><label>Explanation</label><textarea id="newClaimExplanation" rows="3" placeholder="Describe the loss and damage"></textarea></div><div class="field"><label>Photos or videos</label><input id="newClaimFiles" type="file" accept="image/*,video/*" multiple></div><div class="notice blue">Fictional claim scenario only. Selected files are not transferred and no claim is filed.</div>','Create sample claim','claim-confirm');break;
case'claim-confirm':{const explanation=($('#newClaimExplanation')?.value||'').trim(),files=Array.from($('#newClaimFiles')?.files||[]).map(f=>f.name);const c={id:'CL-'+Math.floor(260200+Math.random()*700),type:$('#newClaimType')?.value||'Auto loss',explanation:explanation||'Sample first notice of loss',files};state.customerClaims.unshift(c);persist('cedarCustomerClaims',state.customerClaims);$('#overlay').innerHTML='';render();toast('Sample claim '+c.id+' created locally with '+files.length+' attachment(s).');break}
case'clear-docs':state.customerDocs=[];persist('cedarCustomerDocs',state.customerDocs);render();toast('Uploaded document list cleared.');break;
case'role':switchRole(t.dataset.value);break;case'product':state.quoteProduct=t.dataset.value;state.quote=null;render();break;case'calculate':calculate();break;case'run-checks':state.checksRun=true;render();toast('Sample data checks completed locally; no external reports were requested.');break;case'bind':bind();break;case'close':$('#overlay').innerHTML='';break;case'shade':if(e.target===t)$('#overlay').innerHTML='';break;case'confirm-bind':if(state.quote){state.quote.bound=true;state.quote.policyId='PL-CA-'+Math.floor(100000+Math.random()*899999);state.quote.status='Bind request submitted';}$('#overlay').innerHTML='';render();toast('Sample e-signature recorded. Policy request created.');break;case'toggle':state.billing[t.dataset.key]=!state.billing[t.dataset.key];localStorage.setItem('cedarBilling',JSON.stringify(state.billing));render();toast(t.dataset.key==='paperless'?'Paperless preference updated.':'Automatic payment preference updated.');break;case'payment':modal('Make a sample payment',`<p>Pay the upcoming installment using the demonstration payment method.</p><div class="field"><label>Amount</label><input value="$214.80" disabled></div><div class="field" style="margin-top:10px"><label>Payment method</label><input value="Visa ending 4821 · sample token" disabled></div><div class="notice" style="margin-top:12px">No payment credentials are stored and no transaction will be sent.</div>`,'Submit sample payment','pay-confirm');break;case'pay-confirm':$('#overlay').innerHTML='';toast('Sample payment marked as submitted. No funds moved.');break;case'new-claim':modal('First notice of loss',`<p>Capture the first notice before assigning the claim.</p><div class="fieldgrid"><div class="field"><label>Policy</label><select><option>Auto · PA-CA-209538</option><option>Home · HO-CA-108421</option></select></div><div class="field"><label>Date of loss</label><input type="date" value="2026-11-13"></div><div class="field"><label>Loss type</label><select><option>Collision</option><option>Property damage</option><option>Theft</option><option>Weather / fire</option></select></div><div class="field"><label>Injuries reported?</label><select><option>No</option><option>Yes</option><option>Unknown</option></select></div></div><div class="notice" style="margin-top:12px">Demo only; not an emergency reporting service. Call emergency services where needed.</div>`,'Create sample claim','claim-confirm');break;case'claim-confirm':$('#overlay').innerHTML='';toast('Sample claim CL-260219 created in this browser.');break;case'endorse':modal('Request a policy change',`<p>Model an effective-dated endorsement on the home policy.</p><div class="fieldgrid"><div class="field"><label>Change type</label><select><option>Add scheduled item</option><option>Change deductible</option><option>Update address</option><option>Add water backup</option></select></div><div class="field"><label>Requested effective date</label><input type="date" value="2026-12-01"></div></div><div class="notice blue" style="margin-top:12px">A production transaction validates eligibility, forms, notices, premium impact, and approval before commit.</div>`,'Submit sample request','endorse-confirm');break;case'endorse-confirm':$('#overlay').innerHTML='';toast('Sample endorsement request sent to policy service queue.');break;case'doc':toast('Sample document preview is available in a live policy system.');break;case'coverage':modal('Coverage selection',`<div class="fieldgrid"><div class="field"><label>Auto bodily injury</label><select><option>100 / 300</option><option>50 / 100</option><option>250 / 500</option></select></div><div class="field"><label>Home deductible</label><select><option>$1,500</option><option>$2,500</option><option>$5,000</option></select></div></div><div class="notice" style="margin-top:12px">Minimum liability requirements and coverage offers should be validated against the current California rules and approved forms.</div>`,'Save selection','close');break;case'quote-details':modal('Illustrative rating trace',`<div class="settingrow"><span>Base premium and selected risks</span><b>${money(state.quote.annual+state.quote.discount)}</b></div><div class="settingrow"><span>Good driver / bundle savings</span><b>−${money(state.quote.discount)}</b></div><div class="settingrow"><span>Territory relativity</span><b>${state.settings.territoryFactor}×</b></div><div class="settingrow"><span>Estimated annual premium</span><b>${money(state.quote.annual)}</b></div><p>Real rating requires a filed plan, approved factors, actuarial support, and a rating trace tied to the quote version.</p>`,'Close','close');break;case'config-tab':state.configTab=t.dataset.value;render();break;case'save-settings':$$('[data-setting]').forEach(i=>state.settings[i.dataset.setting]=Number(i.value));localStorage.setItem('cedarSettings',JSON.stringify(state.settings));render();toast('Draft settings saved in this browser.');break;case'reset-settings':localStorage.removeItem('cedarSettings');location.reload();break;case'uw-approve':modal('Clear referral',`<p>Record a decision note and clear the referral for the next workflow step.</p><div class="notice green">Selected case: CL-QU-240${19-state.selectedSubmission} · ${['Jordan Miller','Priya Shah','Marcus Lee','Elena Ruiz'][state.selectedSubmission]}</div><p><b>Decision note:</b> ${$('#uwNote')?.value||'No rationale entered.'}</p><p>Decision, authority, evidence, and user identity should be captured in an immutable audit event in a production system.</p>`,'Confirm clear','decision-confirm');break;case'uw-adjust':modal('Adjust sample quote',`<p>Make an effective-dated adjustment with a recorded reason. Values remain in this browser.</p><div class="fieldgrid"><div class="field"><label>Coverage / deductible change</label><select><option>Raise liability limits</option><option>Change collision deductible</option><option>Update property deductible</option><option>Add approved mitigation credit</option></select></div><div class="field"><label>Premium adjustment</label><select><option value="0">No premium change</option><option value="-5">−5% · documented credit</option><option value="5">+5% · documented surcharge</option></select></div><div class="field"><label>Effective date</label><input type="date" value="2026-12-01"></div><div class="field"><label>Authority</label><select><option>Level 1 · within filed rules</option><option>Level 2 · delegated exception</option><option>Escalate to manager</option></select></div></div><div class="field" style="margin-top:10px"><label>Decision rationale</label><input value="Documented review of submitted risk information and applicable rule"></div><div class="notice blue" style="margin-top:12px">Production changes require filed-rule validation, premium recalculation, customer notice, and an auditable approval event.</div>`,'Save sample adjustment','uw-adjust-confirm');break;case'uw-adjust-confirm':$('#overlay').innerHTML='';toast('Sample adjustment saved to the underwriting activity trail.');break;case'uw-info':toast('Information request queued for producer follow-up.');break;case'uw-decline':modal('Refer for additional review',`<p>Record the applicable rule and evidence before an adverse underwriting decision.</p><div class="notice red">Do not use a demo score by itself as the reason to decline. Check current law, notices, filed guidelines, and assigned authority.</div><div class="field"><label>Reason / applicable rule</label><input value="Additional documentation required under filed guideline"></div>`,'Record referral','decision-confirm');break;case'decision-confirm':$('#overlay').innerHTML='';toast('Decision recorded in the sample activity log.');break;case'select-submission':state.selectedSubmission=Number(t.dataset.index);if(state.role==='Producer')state.producerTechnical=true;render();break;case'producer-tech-toggle':state.producerTechnical=!state.producerTechnical;render();break;case'download-commission':downloadCommissionStatement();break;case'log-communication':modal('Log client contact','<p>Record a producer follow-up against a sample submission.</p><div class="field"><label>Client and submission</label><select id="commClient"><option value="Jordan Miller|CL-QU-24019">Jordan Miller · CL-QU-24019</option><option value="Priya Shah|CL-QU-24018">Priya Shah · CL-QU-24018</option><option value="Marcus Lee|CL-QU-24016">Marcus Lee · CL-QU-24016</option><option value="Elena Ruiz|CL-QU-24011">Elena Ruiz · CL-QU-24011</option></select></div><div class="fieldgrid" style="margin-top:10px"><div class="field"><label>Channel</label><select id="commChannel"><option>Phone</option><option>Email</option><option>Secure portal</option><option>In person</option></select></div><div class="field"><label>Outcome</label><select id="commOutcome"><option>Reached client</option><option>Left message</option><option>Documents requested</option><option>Quote reviewed</option></select></div></div><div class="field" style="margin-top:10px"><label>Contact note</label><textarea id="commNote" rows="3" placeholder="Brief, factual follow-up note"></textarea></div>','Save sample contact','save-communication');break;case'save-communication':{const parts=($('#commClient')?.value||'Jordan Miller|CL-QU-24019').split('|'),note=($('#commNote')?.value||'').trim();if(!note){toast('Add a short contact note first.');break}state.clientComms.unshift({client:parts[0],submission:parts[1],channel:$('#commChannel')?.value||'Phone',date:new Date().toLocaleString(),outcome:($('#commOutcome')?.value||'Contact logged')+' · '+note});persist('cedarProducerComms',state.clientComms);$('#overlay').innerHTML='';render();toast('Sample client contact logged locally.');break}case'producer-filter':state.producerFilter=t.dataset.value||'All';render();break;case'producer-compare':state.producerCompare=!state.producerCompare;render();break;case'appetite-select':state.appetiteLine=t.dataset.value||'Auto';render();break;case'qa-run':state.qaResults=tests.slice();state.qaRun=true;render();toast('18 sample scenarios completed: 17 passed, 1 usability observation.');break;case'qa-run-selected':state.qaResults=tests.filter(x=>state.qaGroup==='All tests'||x[3]===state.qaGroup);state.qaRun=true;render();toast(`${state.qaResults.length} sample scenarios completed.`);break;case'qa-reset':state.qaRun=false;state.qaResults=[];state.qaGroup='All tests';render();toast('QA bench reset to baseline.');break;case'qa-group':state.qaGroup=t.dataset.value;render();break;case'menu':$('.sidebar').classList.toggle('mobile-open');break;case'support-request':modal('Secure service request',`<p>Select a topic and add a concise description. This sample request stays in this browser.</p><div class="field"><label>Topic</label><select><option>Policy question</option><option>Address change</option><option>Billing question</option><option>Claim status</option></select></div><div class="field" style="margin-top:10px"><label>Message</label><input placeholder="How can we help?"></div>`,'Submit sample request','support-confirm');break;case'support-confirm':$('#overlay').innerHTML='';toast('Sample service request created.');break;}}
);
document.addEventListener('change',e=>{if(e.target?.id==='customerDocUpload'){const files=Array.from(e.target.files||[]).map(f=>({name:f.name,date:new Date().toLocaleDateString()}));if(files.length){state.customerDocs=(state.customerDocs||[]).concat(files);persist('cedarCustomerDocs',state.customerDocs);render();toast(files.length+' document name(s) added locally. Files were not uploaded.')}}});
const savedBill=JSON.parse(localStorage.getItem('cedarBilling')||'null');if(savedBill)state.billing=savedBill;const savedSettings=JSON.parse(localStorage.getItem('cedarSettings')||'null');if(savedSettings)state.settings={...state.settings,...savedSettings};render();
})();
